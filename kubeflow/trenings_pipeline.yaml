# PIPELINE DEFINITION
# Name: nav-trenings-pipeline
# Description: Label Studio-korreksjoner → LayoutLMv3-finjustering
components:
  comp-eksporter-steg:
    executorLabel: exec-eksporter-steg
  comp-finjuster-steg:
    executorLabel: exec-finjuster-steg
  comp-konverter-steg:
    executorLabel: exec-konverter-steg
deploymentSpec:
  executors:
    exec-eksporter-steg:
      container:
        command:
        - python
        - skript/eksporter_fra_label_studio.py
        env:
        - name: FINJUSTERING_STI
          value: /data/finjustering
        - name: MODELLER_STI
          value: /modeller
        - name: LABEL_STUDIO_URL
          value: http://label-studio:8080
        image: nav/trening:lokal
    exec-finjuster-steg:
      container:
        command:
        - python
        - skript/finjuster.py
        env:
        - name: FINJUSTERING_STI
          value: /data/finjustering
        - name: MODELLER_STI
          value: /modeller
        - name: LABEL_STUDIO_URL
          value: http://label-studio:8080
        image: nav/trening:lokal
    exec-konverter-steg:
      container:
        command:
        - python
        - skript/konverter_til_layoutlmv3.py
        env:
        - name: FINJUSTERING_STI
          value: /data/finjustering
        - name: MODELLER_STI
          value: /modeller
        - name: LABEL_STUDIO_URL
          value: http://label-studio:8080
        image: nav/trening:lokal
pipelineInfo:
  description: "Label Studio-korreksjoner \u2192 LayoutLMv3-finjustering"
  name: nav-trenings-pipeline
root:
  dag:
    tasks:
      eksporter-steg:
        cachingOptions: {}
        componentRef:
          name: comp-eksporter-steg
        taskInfo:
          name: eksporter-steg
      finjuster-steg:
        cachingOptions: {}
        componentRef:
          name: comp-finjuster-steg
        dependentTasks:
        - konverter-steg
        taskInfo:
          name: finjuster-steg
      konverter-steg:
        cachingOptions: {}
        componentRef:
          name: comp-konverter-steg
        dependentTasks:
        - eksporter-steg
        taskInfo:
          name: konverter-steg
schemaVersion: 2.1.0
sdkVersion: kfp-2.16.1
---
platforms:
  kubernetes:
    deploymentSpec:
      executors:
        exec-eksporter-steg:
          imagePullPolicy: IfNotPresent
          pvcMount:
          - constant: nav-data
            mountPath: /data
            pvcNameParameter:
              runtimeValue:
                constant: nav-data
          - constant: nav-modeller
            mountPath: /modeller
            pvcNameParameter:
              runtimeValue:
                constant: nav-modeller
        exec-finjuster-steg:
          imagePullPolicy: IfNotPresent
          pvcMount:
          - constant: nav-data
            mountPath: /data
            pvcNameParameter:
              runtimeValue:
                constant: nav-data
          - constant: nav-modeller
            mountPath: /modeller
            pvcNameParameter:
              runtimeValue:
                constant: nav-modeller
        exec-konverter-steg:
          imagePullPolicy: IfNotPresent
          pvcMount:
          - constant: nav-data
            mountPath: /data
            pvcNameParameter:
              runtimeValue:
                constant: nav-data
          - constant: nav-modeller
            mountPath: /modeller
            pvcNameParameter:
              runtimeValue:
                constant: nav-modeller
