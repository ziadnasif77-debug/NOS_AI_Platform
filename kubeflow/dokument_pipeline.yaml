# PIPELINE DEFINITION
# Name: nav-dokument-pipeline
# Description: Preprocess → OCR → NLP → Routing for ett NAV-dokument
# Inputs:
#    job_id: str
components:
  comp-nlp-steg:
    executorLabel: exec-nlp-steg
    inputDefinitions:
      parameters:
        job_id:
          parameterType: STRING
  comp-ocr-steg:
    executorLabel: exec-ocr-steg
    inputDefinitions:
      parameters:
        job_id:
          parameterType: STRING
  comp-preprocess-steg:
    executorLabel: exec-preprocess-steg
    inputDefinitions:
      parameters:
        job_id:
          parameterType: STRING
  comp-routing-steg:
    executorLabel: exec-routing-steg
    inputDefinitions:
      parameters:
        job_id:
          parameterType: STRING
deploymentSpec:
  executors:
    exec-nlp-steg:
      container:
        args:
        - --steg
        - nlp
        - --job-id
        - '{{$.inputs.parameters[''job_id'']}}'
        command:
        - python
        - -m
        - tjenester.workers.kfp_steg
        image: nav/lag2:lokal
    exec-ocr-steg:
      container:
        args:
        - --steg
        - ocr
        - --job-id
        - '{{$.inputs.parameters[''job_id'']}}'
        command:
        - python
        - -m
        - tjenester.workers.kfp_steg
        image: nav/lag1:lokal
    exec-preprocess-steg:
      container:
        args:
        - --steg
        - preprocess
        - --job-id
        - '{{$.inputs.parameters[''job_id'']}}'
        command:
        - python
        - -m
        - tjenester.workers.kfp_steg
        image: nav/lag0:lokal
    exec-routing-steg:
      container:
        args:
        - --steg
        - routing
        - --job-id
        - '{{$.inputs.parameters[''job_id'']}}'
        command:
        - python
        - -m
        - tjenester.workers.kfp_steg
        image: nav/lag3:lokal
pipelineInfo:
  description: "Preprocess \u2192 OCR \u2192 NLP \u2192 Routing for ett NAV-dokument"
  name: nav-dokument-pipeline
root:
  dag:
    tasks:
      nlp-steg:
        cachingOptions: {}
        componentRef:
          name: comp-nlp-steg
        dependentTasks:
        - ocr-steg
        inputs:
          parameters:
            job_id:
              componentInputParameter: job_id
        taskInfo:
          name: nlp-steg
      ocr-steg:
        cachingOptions: {}
        componentRef:
          name: comp-ocr-steg
        dependentTasks:
        - preprocess-steg
        inputs:
          parameters:
            job_id:
              componentInputParameter: job_id
        taskInfo:
          name: ocr-steg
      preprocess-steg:
        cachingOptions: {}
        componentRef:
          name: comp-preprocess-steg
        inputs:
          parameters:
            job_id:
              componentInputParameter: job_id
        taskInfo:
          name: preprocess-steg
      routing-steg:
        cachingOptions: {}
        componentRef:
          name: comp-routing-steg
        dependentTasks:
        - nlp-steg
        inputs:
          parameters:
            job_id:
              componentInputParameter: job_id
        taskInfo:
          name: routing-steg
  inputDefinitions:
    parameters:
      job_id:
        parameterType: STRING
schemaVersion: 2.1.0
sdkVersion: kfp-2.16.1
---
platforms:
  kubernetes:
    deploymentSpec:
      executors:
        exec-nlp-steg:
          imagePullPolicy: IfNotPresent
          pvcMount:
          - constant: nav-data
            mountPath: /data
            pvcNameParameter:
              runtimeValue:
                constant: nav-data
          - constant: nav-modeller
            mountPath: /modeller
            pvcNameParameter:
              runtimeValue:
                constant: nav-modeller
          secretAsEnv:
          - keyToEnv:
            - envVar: POSTGRES_URL
              secretKey: POSTGRES_URL
            optional: false
            secretName: nav-hemmeligheter
            secretNameParameter:
              runtimeValue:
                constant: nav-hemmeligheter
        exec-ocr-steg:
          imagePullPolicy: IfNotPresent
          pvcMount:
          - constant: nav-data
            mountPath: /data
            pvcNameParameter:
              runtimeValue:
                constant: nav-data
          - constant: nav-modeller
            mountPath: /modeller
            pvcNameParameter:
              runtimeValue:
                constant: nav-modeller
          secretAsEnv:
          - keyToEnv:
            - envVar: POSTGRES_URL
              secretKey: POSTGRES_URL
            optional: false
            secretName: nav-hemmeligheter
            secretNameParameter:
              runtimeValue:
                constant: nav-hemmeligheter
        exec-preprocess-steg:
          imagePullPolicy: IfNotPresent
          pvcMount:
          - constant: nav-data
            mountPath: /data
            pvcNameParameter:
              runtimeValue:
                constant: nav-data
          secretAsEnv:
          - keyToEnv:
            - envVar: POSTGRES_URL
              secretKey: POSTGRES_URL
            optional: false
            secretName: nav-hemmeligheter
            secretNameParameter:
              runtimeValue:
                constant: nav-hemmeligheter
        exec-routing-steg:
          imagePullPolicy: IfNotPresent
          pvcMount:
          - constant: nav-data
            mountPath: /data
            pvcNameParameter:
              runtimeValue:
                constant: nav-data
          secretAsEnv:
          - keyToEnv:
            - envVar: POSTGRES_URL
              secretKey: POSTGRES_URL
            optional: false
            secretName: nav-hemmeligheter
            secretNameParameter:
              runtimeValue:
                constant: nav-hemmeligheter
