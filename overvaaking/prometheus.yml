# Prometheus-scrape-konfig for lokal docker-compose-kjøring.
# Start med: make overvaaking
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: workers
    static_configs:
      - targets:
          - preprocessing_worker:9101
          - ocr_worker:9101
          - nlp_worker:9101
          - routing_worker:9101
