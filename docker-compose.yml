version: "3.9"

services:
  # ─── Nye lagdelte tjenester ─────────────────────────────────────────────────

  lag0:
    build: ./tjenester/lag0_kvalitet
    volumes:
      - ./config:/config
      - ./delt:/delt
      - ${BEHANDLET_STI:-./data/behandlet}:/data/behandlet
    environment:
      - PYTHONPATH=/config:/delt
    ports:
      - "8010:8010"
    restart: unless-stopped

  lag1:
    build: ./tjenester/lag1_klassifisering
    volumes:
      - ./config:/config
      - ./delt:/delt
      - ${BEHANDLET_STI:-./data/behandlet}:/data/behandlet
    environment:
      - PYTHONPATH=/config:/delt
    ports:
      - "8011:8011"
    restart: unless-stopped

  lag2:
    build: ./tjenester/lag2_ocr
    volumes:
      - ./config:/config
      - ./delt:/delt
      - ${BEHANDLET_STI:-./data/behandlet}:/data/behandlet
      - ${MODELLER_STI:-./modeller}:/modeller
    environment:
      - PYTHONPATH=/config:/delt
    depends_on:
      - redis
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "8012:8012"
    restart: unless-stopped

  lag3:
    build: ./tjenester/lag3_nlp
    volumes:
      - ./config:/config
      - ./delt:/delt
      - ${BEHANDLET_STI:-./data/behandlet}:/data/behandlet
      - ${MODELLER_STI:-./modeller}:/modeller
    environment:
      - PYTHONPATH=/config:/delt
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "8013:8013"
    restart: unless-stopped

  lag4:
    build: ./tjenester/lag4_validering
    volumes:
      - ./config:/config
      - ./delt:/delt
    environment:
      - PYTHONPATH=/config:/delt
    ports:
      - "8014:8014"
    restart: unless-stopped

  lag5:
    build: ./tjenester/lag5_kryssvalidering
    volumes:
      - ./config:/config
      - ./delt:/delt
    environment:
      - PYTHONPATH=/config:/delt
    depends_on:
      - milvus
    ports:
      - "8015:8015"
    restart: unless-stopped

  ruter:
    build: ./tjenester/ruter
    volumes:
      - ./config:/config
      - ./delt:/delt
    environment:
      - PYTHONPATH=/config:/delt
    depends_on:
      - lag0
      - lag1
      - lag2
      - lag3
      - lag4
      - redis
    ports:
      - "8016:8016"
    restart: unless-stopped

  # ─── Gamle tjenester (legacy) ─────────────────────────────────────────────

  ocr:
    profiles: [legacy]
    build: ./tjenester/ocr
    volumes:
      - ${INNTAK_STI}:/data/inntak
      - ${BEHANDLET_STI}:/data/behandlet
      - ${MODELLER_STI}:/modeller
      - ${LOGGER_STI}:/data/logger
      - ${GJENNOMGANG_STI}:/data/gjennomgang
      - ./delt:/delt
      - ./skript:/skript
    environment:
      - GPU_ENHET=${GPU_ENHET}
      - KONFIDENS_TERSKEL=${KONFIDENS_TERSKEL}
      - NLP_URL=http://nlp:8002
      - LABEL_STUDIO_URL=http://label-studio:8080
      - LABEL_STUDIO_API_KEY=${LABEL_STUDIO_API_KEY}
      - LABEL_STUDIO_OCR_PROSJEKT_ID=${LABEL_STUDIO_OCR_PROSJEKT_ID}
      - INNTAK_STI=/data/inntak
      - BEHANDLET_STI=/data/behandlet
      - MODELLER_STI=/modeller
      - GJENNOMGANG_STI=/data/gjennomgang
      - REDIS_URL=redis://redis:6379/0
      - MAKS_OCR_JOBBER=${MAKS_OCR_JOBBER:-2}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "${OCR_PORT}:8001"
    healthcheck:
      test: ["CMD", "python", "helsesjekk.py"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - redis
    restart: unless-stopped

  nlp:
    profiles: [legacy]
    build: ./tjenester/nlp
    volumes:
      - ${BEHANDLET_STI}:/data/behandlet
      - ${MODELLER_STI}:/modeller
      - ${LOGGER_STI}:/data/logger
      - ./delt:/delt
    environment:
      - GPU_ENHET=${GPU_ENHET}
      - SOK_URL=http://sok:8003
      - MODELLER_STI=/modeller
      - BEHANDLET_STI=/data/behandlet
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "${NLP_PORT}:8002"
    healthcheck:
      test: ["CMD", "python", "helsesjekk.py"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - ocr
    restart: unless-stopped

  sok:
    build: ./tjenester/sok
    volumes:
      - ${BEHANDLET_STI:-./data/behandlet}:/data/behandlet
      - ${MODELLER_STI:-./modeller}:/modeller
      - ./delt:/delt
    environment:
      - MILVUS_VERT=${MILVUS_VERT:-milvus}
      - MILVUS_PORT=${MILVUS_PORT:-19530}
      - MILVUS_SAMLING=${MILVUS_SAMLING:-nav_dokumenter}
      - MODELLER_STI=/modeller
    ports:
      - "${SOK_PORT:-8003}:8003"
    healthcheck:
      test: ["CMD", "python", "helsesjekk.py"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - milvus
    restart: unless-stopped

  api:
    build: ./tjenester/api
    volumes:
      - ${DATA_STI:-./data}:/data
      - ./delt:/delt
    environment:
      - OCR_URL=http://ocr:8001
      - NLP_URL=http://nlp:8002
      - SOK_URL=http://sok:8003
      - GJENNOMGANG_URL=http://label-studio:8080
      - INNTAK_STI=/data/inntak
      - API_NOKKEL=${API_NOKKEL}
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/helse"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - redis
    restart: unless-stopped

  label-studio:
    image: heartexlabs/label-studio:latest
    ports:
      - "${LABEL_STUDIO_PORT:-8080}:8080"
    volumes:
      - ${GJENNOMGANG_STI:-./data/gjennomgang}:/label-studio/data
      - ${FINJUSTERING_STI:-./data/finjustering}:/label-studio/export
      - label_studio_data:/label-studio/data
    environment:
      - LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED=true
      - LABEL_STUDIO_LOCAL_FILES_DOCUMENT_ROOT=/label-studio/data
      - LABEL_STUDIO_HOST=http://host.docker.internal:${LABEL_STUDIO_PORT:-8080}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ─── V2.1 Worker-tjenester ────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nav
      POSTGRES_PASSWORD: nav
      POSTGRES_DB: nav_archive
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "nav"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  preprocessing_worker:
    build:
      context: .
      dockerfile: tjenester/workers/lag0_preprocessing/Dockerfile
    volumes:
      - ./config:/app/config
      - ./delt:/app/delt
      - ./tjenester/workers:/app/tjenester/workers
      - ${DATA_STI:-./data}:/data
    environment:
      - PYTHONPATH=/app
      - INNTAK_STI=/data/inntak
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  ocr_worker:
    build:
      context: .
      dockerfile: tjenester/workers/lag1_ocr/Dockerfile
    volumes:
      - ./config:/app/config
      - ./delt:/app/delt
      - ./tjenester/workers:/app/tjenester/workers
      - ${DATA_STI:-./data}:/data
      - ${MODELLER_STI:-./modeller}:/modeller
    environment:
      - PYTHONPATH=/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  nlp_worker:
    build:
      context: .
      dockerfile: tjenester/workers/lag2_nlp/Dockerfile
    volumes:
      - ./config:/app/config
      - ./delt:/app/delt
      - ./tjenester/workers:/app/tjenester/workers
      - ${DATA_STI:-./data}:/data
      - ${MODELLER_STI:-./modeller}:/modeller
    environment:
      - PYTHONPATH=/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  routing_worker:
    build:
      context: .
      dockerfile: tjenester/workers/lag3_routing/Dockerfile
    volumes:
      - ./config:/app/config
      - ./delt:/app/delt
      - ./tjenester/workers:/app/tjenester/workers
      - ${DATA_STI:-./data}:/data
    environment:
      - PYTHONPATH=/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  reconciliation_worker:
    build:
      context: .
      dockerfile: tjenester/workers/reconciliation/Dockerfile
    volumes:
      - ./config:/app/config
      - ./delt:/app/delt
      - ./tjenester/workers:/app/tjenester/workers
    environment:
      - PYTHONPATH=/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.4.5
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "${MILVUS_PORT:-19530}:19530"
    depends_on:
      - etcd
      - minio
    restart: unless-stopped

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    volumes:
      - etcd_data:/etcd
    command: >
      etcd
      --advertise-client-urls=http://127.0.0.1:2379
      --listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2023-03-13T19-46-17Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data
    restart: unless-stopped

volumes:
  milvus_data:
  etcd_data:
  minio_data:
  label_studio_data:
  redis_data:
  postgres_data:
