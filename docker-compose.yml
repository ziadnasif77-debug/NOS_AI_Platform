services:
  # ─── Nye lagdelte tjenester ─────────────────────────────────────────────────

  lag0:
    profiles: [legacy]
    build: ./tjenester/lag0_kvalitet
    volumes:
      - ./config:/config
      - ./delt:/delt
      - ${BEHANDLET_STI:-./data/behandlet}:/data/behandlet
    environment:
      - PYTHONPATH=/config:/delt
    ports:
      - "8010:8010"
    restart: unless-stopped

  lag1:
    profiles: [legacy]
    build: ./tjenester/lag1_klassifisering
    volumes:
      - ./config:/config
      - ./delt:/delt
      - ${BEHANDLET_STI:-./data/behandlet}:/data/behandlet
    environment:
      - PYTHONPATH=/config:/delt
    ports:
      - "8011:8011"
    restart: unless-stopped

  lag2:
    profiles: [legacy]
    build: ./tjenester/lag2_ocr
    volumes:
      - ./config:/config
      - ./delt:/delt
      - ${BEHANDLET_STI:-./data/behandlet}:/data/behandlet
      - ${MODELLER_STI:-./modeller}:/modeller
    environment:
      - PYTHONPATH=/config:/delt
    depends_on:
      - redis
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "8012:8012"
    restart: unless-stopped

  lag3:
    profiles: [legacy]
    build: ./tjenester/lag3_nlp
    volumes:
      - ./config:/config
      - ./delt:/delt
      - ${BEHANDLET_STI:-./data/behandlet}:/data/behandlet
      - ${MODELLER_STI:-./modeller}:/modeller
    environment:
      - PYTHONPATH=/config:/delt
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "8013:8013"
    restart: unless-stopped

  lag4:
    profiles: [legacy]
    build: ./tjenester/lag4_validering
    volumes:
      - ./config:/config
      - ./delt:/delt
    environment:
      - PYTHONPATH=/config:/delt
    ports:
      - "8014:8014"
    restart: unless-stopped

  lag5:
    profiles: [legacy]
    build: ./tjenester/lag5_kryssvalidering
    volumes:
      - ./config:/config
      - ./delt:/delt
    environment:
      - PYTHONPATH=/config:/delt
    depends_on:
      - milvus
    ports:
      - "8015:8015"
    restart: unless-stopped

  ruter:
    profiles: [legacy]
    build: ./tjenester/ruter
    volumes:
      - ./config:/config
      - ./delt:/delt
    environment:
      - PYTHONPATH=/config:/delt
    depends_on:
      - lag0
      - lag1
      - lag2
      - lag3
      - lag4
      - redis
    ports:
      - "8016:8016"
    restart: unless-stopped

  # ─── Gamle tjenester (legacy) ─────────────────────────────────────────────

  ocr:
    profiles: [legacy]
    build: ./tjenester/ocr
    volumes:
      - ${INNTAK_STI}:/data/inntak
      - ${BEHANDLET_STI}:/data/behandlet
      - ${MODELLER_STI}:/modeller
      - ${LOGGER_STI}:/data/logger
      - ${GJENNOMGANG_STI}:/data/gjennomgang
      - ./delt:/delt
      - ./skript:/skript
    environment:
      - GPU_ENHET=${GPU_ENHET}
      - KONFIDENS_TERSKEL=${KONFIDENS_TERSKEL}
      - NLP_URL=http://nlp:8002
      - LABEL_STUDIO_URL=http://label-studio:8080
      - LABEL_STUDIO_API_KEY=${LABEL_STUDIO_API_KEY}
      - LABEL_STUDIO_OCR_PROSJEKT_ID=${LABEL_STUDIO_OCR_PROSJEKT_ID}
      - INNTAK_STI=/data/inntak
      - BEHANDLET_STI=/data/behandlet
      - MODELLER_STI=/modeller
      - GJENNOMGANG_STI=/data/gjennomgang
      - REDIS_URL=redis://redis:6379/0
      - MAKS_OCR_JOBBER=${MAKS_OCR_JOBBER:-2}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "${OCR_PORT}:8001"
    healthcheck:
      test: ["CMD", "python", "helsesjekk.py"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - redis
    restart: unless-stopped

  nlp:
    profiles: [legacy]
    build: ./tjenester/nlp
    volumes:
      - ${BEHANDLET_STI}:/data/behandlet
      - ${MODELLER_STI}:/modeller
      - ${LOGGER_STI}:/data/logger
      - ./delt:/delt
    environment:
      - GPU_ENHET=${GPU_ENHET}
      - SOK_URL=http://sok:8003
      - MODELLER_STI=/modeller
      - BEHANDLET_STI=/data/behandlet
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "${NLP_PORT}:8002"
    healthcheck:
      test: ["CMD", "python", "helsesjekk.py"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - ocr
    restart: unless-stopped

  sok:
    build:
      context: .
      dockerfile: tjenester/sok/Dockerfile
    volumes:
      - ${BEHANDLET_STI:-./data/behandlet}:/data/behandlet
      - ${MODELLER_STI:-./modeller}:/modeller
      - ./delt:/delt
    environment:
      - MILVUS_VERT=${MILVUS_VERT:-milvus}
      - MILVUS_PORT=${MILVUS_PORT:-19530}
      - MILVUS_SAMLING=${MILVUS_SAMLING:-nav_dokumenter}
      - MODELLER_STI=/modeller
      # Sok-tjenesten manglet API_NOKKEL → autentiseringen var åpen
      # (tom nøkkel = fri tilgang, autentisering.py:79). /indekser, /sok
      # og DELETE var dermed nåbare uautentisert. Arver nå nøkkelen.
      - API_NOKKEL=${API_NOKKEL:-}
    ports:
      # Bundet til 127.0.0.1 som postgres/milvus — søkeindeksen skal
      # aldri nås fra host-nettet. Var «8003:8003» (eksponert på alle
      # grensesnitt) i motsetning til de andre datatjenestene.
      - "127.0.0.1:${SOK_PORT:-8003}:8003"
    healthcheck:
      test: ["CMD", "python", "helsesjekk.py"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - milvus
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: tjenester/api/Dockerfile
    volumes:
      - ${DATA_STI:-./data}:/data
      - ./delt:/delt
      # Live-redigerbar config: virksomhetsregler for /sporsmal leses
      # ferskt per spørsmål — endringer på verten gjelder umiddelbart
      - ./config:/app/config:ro
    environment:
      - OCR_URL=http://ocr:8001
      - NLP_URL=http://nlp:8002
      - SOK_URL=http://sok:8003
      - GJENNOMGANG_URL=http://label-studio:8080
      - INNTAK_STI=/data/inntak
      - LLM_URL=${LLM_URL:-}      # fritekst-spørsmål (/dokument/{id}/sporsmal)
      - LLM_MODELL=${LLM_MODELL:-borealis}
      - API_NOKKEL=${API_NOKKEL}
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/helse"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - redis
    restart: unless-stopped

  label-studio:
    image: heartexlabs/label-studio:latest
    ports:
      - "${LABEL_STUDIO_PORT:-8080}:8080"
    volumes:
      - ${GJENNOMGANG_STI:-./data/gjennomgang}:/label-studio/data
      - ${FINJUSTERING_STI:-./data/finjustering}:/label-studio/export
      - label_studio_data:/label-studio/data
    environment:
      - LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED=true
      - LABEL_STUDIO_LOCAL_FILES_DOCUMENT_ROOT=/label-studio/data
      - LABEL_STUDIO_HOST=http://host.docker.internal:${LABEL_STUDIO_PORT:-8080}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ─── V2.1 Worker-tjenester ────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nav}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nav}
      POSTGRES_DB: nav_archive
    ports:
      # Kun lokal tilgang — databasen med persondata skal ALDRI være
      # nåbar fra host-nettet. Overstyr POSTGRES_BIND for eksponering.
      - "${POSTGRES_BIND:-127.0.0.1}:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "nav"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  preprocessing_worker:
    build:
      context: .
      dockerfile: tjenester/workers/lag0_preprocessing/Dockerfile
    volumes:
      - ./config:/app/config
      - ./delt:/app/delt
      - ./tjenester/workers:/app/tjenester/workers
      - ${DATA_STI:-./data}:/data
    environment:
      - METRIKK_PORT=9101
      - LABEL_STUDIO_API_KEY=${LABEL_STUDIO_API_KEY:-}
      - PYTHONPATH=/app
      - INNTAK_STI=/data/inntak
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  ocr_worker:
    build:
      context: .
      dockerfile: tjenester/workers/lag1_ocr/Dockerfile
    volumes:
      - ./config:/app/config
      - ./delt:/app/delt
      - ./tjenester/workers:/app/tjenester/workers
      - ${DATA_STI:-./data}:/data
      - ${MODELLER_STI:-./modeller}:/modeller
    environment:
      - METRIKK_PORT=9101
      - LABEL_STUDIO_API_KEY=${LABEL_STUDIO_API_KEY:-}
      - PYTHONPATH=/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  nlp_worker:
    build:
      context: .
      dockerfile: tjenester/workers/lag2_nlp/Dockerfile
    volumes:
      - ./config:/app/config
      - ./delt:/app/delt
      - ./tjenester/workers:/app/tjenester/workers
      - ${DATA_STI:-./data}:/data
      - ${MODELLER_STI:-./modeller}:/modeller
    environment:
      - METRIKK_PORT=9101
      - LABEL_STUDIO_API_KEY=${LABEL_STUDIO_API_KEY:-}
      - PYTHONPATH=/app
      - LLM_URL=${LLM_URL:-}      # satt = Borealis via model serving
      - LLM_MODELL=${LLM_MODELL:-borealis}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  routing_worker:
    build:
      context: .
      dockerfile: tjenester/workers/lag3_routing/Dockerfile
    volumes:
      - ./config:/app/config
      - ./delt:/app/delt
      - ./tjenester/workers:/app/tjenester/workers
      - ${DATA_STI:-./data}:/data
    environment:
      - METRIKK_PORT=9101
      - LABEL_STUDIO_API_KEY=${LABEL_STUDIO_API_KEY:-}
      - PYTHONPATH=/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  reconciliation_worker:
    build:
      context: .
      dockerfile: tjenester/workers/reconciliation/Dockerfile
    volumes:
      - ./config:/app/config
      - ./delt:/app/delt
      - ./tjenester/workers:/app/tjenester/workers
    environment:
      - PYTHONPATH=/app
      - LABEL_STUDIO_API_KEY=${LABEL_STUDIO_API_KEY:-}   # LS-ettersending
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # appendonly gjør at kø-elementer overlever et Redis-krasj (ellers
    # kun RDB-snapshots → et krasj kan miste ferske jobber; ghost-
    # detektoren tar dem, men med opptil ~15 min forsinkelse).
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.4.5
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "${MILVUS_BIND:-127.0.0.1}:${MILVUS_PORT:-19530}:19530"
    depends_on:
      - etcd
      - minio
    restart: unless-stopped

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    volumes:
      - etcd_data:/etcd
    command: >
      etcd
      --advertise-client-urls=http://127.0.0.1:2379
      --listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2023-03-13T19-46-17Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data
    restart: unless-stopped

  # ─── Overvåking (valgfri): make overvaaking ────────────────────────────────

  prometheus:
    profiles: [overvaaking]
    image: prom/prometheus:latest
    volumes:
      - ./overvaaking/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    profiles: [overvaaking]
    image: grafana/grafana:latest
    volumes:
      - ./overvaaking/grafana-datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  loki:
    profiles: [overvaaking]
    image: grafana/loki:latest
    volumes:
      - loki_data:/loki
    ports:
      - "3100:3100"
    restart: unless-stopped

  promtail:
    profiles: [overvaaking]
    image: grafana/promtail:latest
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./overvaaking/promtail.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: unless-stopped

  # Model serving (profil «llm»): Borealis serveres via vLLM med
  # OpenAI-kompatibel API. NLP-workeren blir en lett HTTP-klient
  # (sett LLM_URL i .env) og kan skaleres horisontalt uten GPU.
  # Uten profilen kjører workeren med lokal 4-bit-lasting som før.
  llm:
    profiles: [llm]
    image: vllm/vllm-openai:latest
    environment:
      # Docker Desktop kjører på WSL2: vLLM deaktiverer pinned memory
      # der som standard (UVA-buffere feiler uten). Trygt på WSL2-kjerne
      # ≥ 4.19.121. Irrelevant (ignorert) på ekte Linux/K8s.
      - VLLM_WSL2_ENABLE_PIN_MEMORY=1
    command:
      - --model=/modeller/borealis
      - --served-model-name=borealis
      - --quantization=bitsandbytes
      - --max-model-len=4096
      - --gpu-memory-utilization=${LLM_GPU_ANDEL:-0.60}
      - --dtype=bfloat16
    ports:
      - "8020:8000"
    volumes:
      - ${MODELLER_STI:-./modeller}:/modeller:ro
    ipc: host                      # vLLM krever delt minne
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 20
      start_period: 300s           # modell-lasting tar tid
    restart: unless-stopped

  # Oppbevaringsbegrensning (NAV: dokumenter maks 6 måneder):
  # sletter filer, results-innhold og søkeindeks-oppføringer eldre
  # enn OPPBEVARING_MAKS_DAGER. Se docs/OPPBEVARING.md.
  oppbevaring:
    build:
      context: .
      dockerfile: tjenester/oppbevaring/Dockerfile
    environment:
      - POSTGRES_URL=postgresql://nav:nav@postgres:5432/nav_archive
      - SOK_URL=http://sok:8003
      - API_NOKKEL=${API_NOKKEL}
      - DATA_STI=/data
      - OPPBEVARING_MAKS_DAGER=${OPPBEVARING_MAKS_DAGER:-150}
      - OPPBEVARING_INTERVALL_TIMER=${OPPBEVARING_INTERVALL_TIMER:-24}
      - LABEL_STUDIO_URL=http://label-studio:8080
      - LABEL_STUDIO_API_KEY=${LABEL_STUDIO_API_KEY:-}
    volumes:
      - ${DATA_STI:-./data}:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  backup:
    build:
      context: .
      dockerfile: tjenester/backup/Dockerfile
    environment:
      - POSTGRES_URL=postgresql://nav:nav@postgres:5432/nav_archive
      - BACKUP_STI=/backup
      - DATA_STI=/data
      - BACKUP_INTERVALL_TIMER=${BACKUP_INTERVALL_TIMER:-24}
      - BACKUP_DAGLIGE=${BACKUP_DAGLIGE:-7}
      - BACKUP_UKENTLIGE=${BACKUP_UKENTLIGE:-4}
      # Månedlige kopier MÅ være av (0) for å holde 180-dagersbudsjettet
      # (NAV 6-månedersregel). Koden i sikkerhetskopi.py:45 har 0 som
      # standard med eksplisitt advarsel; denne fallbacken var 6, som ga
      # eldste dump ~180 dager + 150 dagers oppbevaring ≈ 330 dager
      # persondata i backup. Rettet til 0.
      - BACKUP_MAANEDLIGE=${BACKUP_MAANEDLIGE:-0}
    volumes:
      - ${BACKUP_STI:-./data/sikkerhetskopi}:/backup
      - ${DATA_STI:-./data}:/data:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped


volumes:
  milvus_data:
  etcd_data:
  minio_data:
  label_studio_data:
  redis_data:
  postgres_data:
  prometheus_data:
  grafana_data:
  loki_data:
