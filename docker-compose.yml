version: "3.9"

services:
  ocr:
    build: ./tjenester/ocr
    volumes:
      - ${INNTAK_STI}:/data/inntak
      - ${BEHANDLET_STI}:/data/behandlet
      - ${MODELLER_STI}:/modeller
      - ${LOGGER_STI}:/data/logger
      - ./delt:/delt
    environment:
      - GPU_ENHET=${GPU_ENHET}
      - KONFIDENS_TERSKEL=${KONFIDENS_TERSKEL}
      - NLP_URL=http://nlp:8002
      - INNTAK_STI=/data/inntak
      - BEHANDLET_STI=/data/behandlet
      - MODELLER_STI=/modeller
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "${OCR_PORT}:8001"
    healthcheck:
      test: ["CMD", "python", "helsesjekk.py"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  nlp:
    build: ./tjenester/nlp
    volumes:
      - ${BEHANDLET_STI}:/data/behandlet
      - ${MODELLER_STI}:/modeller
      - ${LOGGER_STI}:/data/logger
      - ./delt:/delt
    environment:
      - GPU_ENHET=${GPU_ENHET}
      - SOK_URL=http://sok:8003
      - MODELLER_STI=/modeller
      - BEHANDLET_STI=/data/behandlet
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "${NLP_PORT}:8002"
    healthcheck:
      test: ["CMD", "python", "helsesjekk.py"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - ocr
    restart: unless-stopped

  sok:
    build: ./tjenester/sok
    volumes:
      - ${BEHANDLET_STI}:/data/behandlet
      - ${MODELLER_STI}:/modeller
      - ./delt:/delt
    environment:
      - MILVUS_VERT=${MILVUS_VERT}
      - MILVUS_PORT=${MILVUS_PORT}
      - MILVUS_SAMLING=${MILVUS_SAMLING}
      - MODELLER_STI=/modeller
    ports:
      - "${SOK_PORT}:8003"
    healthcheck:
      test: ["CMD", "python", "helsesjekk.py"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - milvus
      - nlp
    restart: unless-stopped

  api:
    build: ./tjenester/api
    volumes:
      - ${DATA_STI}:/data
      - ./delt:/delt
    environment:
      - OCR_URL=http://ocr:8001
      - NLP_URL=http://nlp:8002
      - SOK_URL=http://sok:8003
      - GJENNOMGANG_URL=http://gjennomgang:8004
      - INNTAK_STI=/data/inntak
    ports:
      - "${API_PORT}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/helse"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - ocr
      - nlp
      - sok
    restart: unless-stopped

  gjennomgang:
    build: ./tjenester/gjennomgang
    volumes:
      - ${GJENNOMGANG_STI}:/data/gjennomgang
      - ${FINJUSTERING_STI}:/data/finjustering
      - ./delt:/delt
    environment:
      - GJENNOMGANG_STI=/data/gjennomgang
      - FINJUSTERING_STI=/data/finjustering
      - MIN_KORREKSJONER_FOR_FINJUSTERING=${MIN_KORREKSJONER_FOR_FINJUSTERING}
    ports:
      - "${GJENNOMGANG_PORT}:8004"
    healthcheck:
      test: ["CMD", "python", "helsesjekk.py"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.4.0
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "${MILVUS_PORT}:19530"
    depends_on:
      - etcd
      - minio
    restart: unless-stopped

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    volumes:
      - etcd_data:/etcd
    command: >
      etcd
      --advertise-client-urls=http://127.0.0.1:2379
      --listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2023-03-13T19-46-17Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data
    restart: unless-stopped

volumes:
  milvus_data:
  etcd_data:
  minio_data:
