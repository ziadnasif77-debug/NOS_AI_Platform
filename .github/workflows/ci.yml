# CI: enhetstester for det LOKALE, portable dokument-API-et.
#
# Denne fila erstatter en som refererte til FIRE ting som ikke finnes:
# skript/init_db.py, tester/test_integrasjon_lokal.py,
# docker-compose.yml og k8s/. De ble slettet sammen med en gammel
# Postgres/K8s-arkitektur, og CI-fila ble stående igjen rundt skjelettet.
#
# Verst var K8s-steget: `Path("k8s").glob()` på en mappe som ikke finnes
# gir en TOM løkke, så steget printet «alle k8s-manifester er gyldig
# YAML» og ble grønt uten å ha validert noe som helst. En garanti som
# ikke finnes, men ser ut som den gjør (R164).
#
# Derfor sjekker steg 1 under at CI bare nevner filer som finnes.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tester:
    # Windows med vilje: prosjektet kjører native på Windows, og
    # .bat-launcherne, kjernemutexen (R141) og EnServer er
    # Windows-spesifikke. Grønn CI på Linux ville bevist feil ting.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ---------------------------------------------------------------
      #  1. CI får ikke nevne filer som ikke finnes
      # ---------------------------------------------------------------
      - name: CI nevner bare filer som finnes
        shell: python
        run: |
          import pathlib, re, sys
          ci = pathlib.Path(".github/workflows/ci.yml").read_text(encoding="utf-8")
          stier = set(re.findall(r"(?:python|-m pytest)\s+([\w./\\-]+\.py)", ci))
          stier |= set(re.findall(r"--ignore=([\w./\\-]+)", ci))
          borte = sorted(s for s in stier if not pathlib.Path(s).exists())
          if borte:
              sys.exit(f"CI refererer til filer som ikke finnes: {borte}")
          print(f"CI nevner {len(stier)} filer, og alle finnes")

      # ---------------------------------------------------------------
      #  2. Avhengigheter
      # ---------------------------------------------------------------
      # Bare det enhetstestene faktisk trenger. Hele krav_lokal.txt
      # (torch+cu124, llama-cpp-python, easyocr) er GPU-hjul på flere GB
      # som ingen GitHub-runner har kort til — og testene håner dem.
      - name: Installer testavhengigheter
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pytest pyyaml requests PyMuPDF numpy pillow opencv-python-headless

      # ---------------------------------------------------------------
      #  3. Enhetstestene — med hoppene SYNLIGE
      # ---------------------------------------------------------------
      # -rs: hvert eneste hopp skrives ut med grunn. Et hopp ingen ser er
      # en garanti som ikke finnes, men ser ut som den gjør.
      - name: Enhetstester
        run: python -m pytest tester/ -q -rs --junitxml=testresultat.xml

      # ---------------------------------------------------------------
      #  4. HOPPBUDSJETT — det viktigste steget i fila
      # ---------------------------------------------------------------
      # Budsjettet gjør tallet til en beslutning: stiger det, må noen ta
      # stilling. Et hopp ingen ser er en garanti som ikke finnes.
      #
      # Målt på en frisk klone, før og etter at data/lover/ ble sporet:
      #     før:  10 failed, 1301 passed, 28 skipped
      #     etter: 0 failed, 1540 passed,  3 skipped
      #
      # De tre som står igjen er ekte og sier hvorfor: .env er en
      # hemmelighet som ikke skal klones, korpusfila er ekte PDF-er, og
      # .pyruntime ligger ikke i git. De kan ikke lukkes uten å legge
      # noe i repoet som ikke hører hjemme der.
      #
      # 5, ikke 3: litt luft for en ny, ærlig grunn — men ikke nok til at
      # et helt datasett kan forsvinne ubemerket.
      - name: Hoppbudsjett
        if: always()
        shell: python
        run: |
          import sys, xml.etree.ElementTree as ET
          BUDSJETT = 5           # senk dette, aldri hev det uten grunn
          r = ET.parse("testresultat.xml").getroot()
          s = r if r.tag == "testsuite" else r.find("testsuite")
          hoppet, totalt = int(s.get("skipped", 0)), int(s.get("tests", 0))
          print(f"{totalt} tester, {hoppet} hoppet over (budsjett {BUDSJETT})")
          if hoppet > BUDSJETT:
              sys.exit(f"FLERE HOPP ENN BUDSJETTERT: {hoppet} > {BUDSJETT}. "
                       f"En test som hopper over vokter ingenting.")

      # ---------------------------------------------------------------
      #  5. Vaktene fra CLAUDE.md, hver for seg og navngitt
      # ---------------------------------------------------------------
      # Kjøres separat selv om de ligger i tester/: feiler §1 eller §4,
      # skal det stå i stegnavnet, ikke drukne blant tusen prikker.
      - name: "CLAUDE.md §4 — all prompttekst i regler/prompter.md"
        run: python -m pytest tester/test_prompter_samlet.py -q

      # MERK: portabilitetsvakten kan IKKE bli grønn på en runner der pip
      # installerer til global site-packages — den måler nettopp at
      # pakker lastes fra nav-mappa. Derfor rapporterer den, og blokkerer
      # ikke. Den ekte kjøringen er på serveren, med .pyruntime.
      - name: "CLAUDE.md §1 — portabilitet (rapporterer, blokkerer ikke)"
        continue-on-error: true
        run: python -m pytest tester/test_portabilitet.py -q -rs

      - name: Kontraktsvakt (profilskjema + API-versjon)
        run: python -m pytest tester/test_kontraktsvakt.py -q -rs

      # ---------------------------------------------------------------
      #  6. Linjeslutt: .bat, .vbs og .ps1 MÅ være CRLF
      # ---------------------------------------------------------------
      # cmd sin parser feiler på LF-bare linjer inne i parentesblokker.
      # .gitattributes dekker .bat og .vbs, men IKKE .ps1 — at den siste
      # kommer riktig ut i dag skyldes bare core.autocrlf på én maskin.
      - name: Linjeslutt på launcherne
        shell: python
        run: |
          import pathlib, sys
          feil, sjekket = [], 0
          for m in ("*.bat", "*.vbs", "*.ps1"):
              for f in pathlib.Path(".").rglob(m):
                  if any(d in f.parts for d in (".pyruntime", ".venv-prefect",
                                                ".python", ".git")):
                      continue
                  sjekket += 1
                  if f.read_bytes().replace(b"\r\n", b"").count(b"\n"):
                      feil.append(str(f))
          if feil:
              sys.exit(f"Disse har LF-linjer og vil brekke cmd: {feil}")
          # ANTALLET, ikke «alle». «alle er i orden» over NULL filer er
          # nøyaktig løgnen K8s-steget fortalte. Et tall kan ikke lyve
          # på den måten — 0 sjekket er synlig.
          if sjekket == 0:
              sys.exit("fant ingen launchere å sjekke — leter vi riktig sted?")
          print(f"{sjekket} launchere sjekket, alle med CRLF")

      - name: Last opp testresultat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testresultat
          path: testresultat.xml
