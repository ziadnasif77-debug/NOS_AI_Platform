  <text x="185" y="950" text-anchor="middle" fill="#f5b8b8" font-size="10">نص → متجهات دلالية (1024 dim)</text>
  <text x="185" y="964" text-anchor="middle" fill="#f5b8b8" font-size="10">tekst → vektorer</text>

  <line x1="328" y1="942" x2="378" y2="942" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow-red)"/>

