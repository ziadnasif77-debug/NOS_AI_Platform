    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#1a6b4a"/>
    </marker>
  </defs>

  <rect width="780" height="1260" fill="#fafaf8"/>

  <!-- ══ ① Inntak ══ -->
  <line x1="30" y1="28" x2="750" y2="28" stroke="#ddd" stroke-width="1"/>
  <circle cx="44" cy="54" r="14" fill="#2c2c2c"/>
  <text x="44" y="59" text-anchor="middle" fill="white" font-size="12" font-weight="bold">①</text>
  <text x="66" y="57" fill="#444" font-size="12" font-weight="600">استقبال / Inntak</text>

  <rect x="230" y="70" width="280" height="54" rx="8" fill="#2c2c2c"/>
  <text x="370" y="93" text-anchor="middle" fill="white" font-size="14" font-weight="bold">PDF — الماسح الضوئي</text>
  <text x="370" y="112" text-anchor="middle" fill="#999" font-size="10">Watchdog — مراقبة مجلد تلقائية</text>

  <line x1="370" y1="124" x2="370" y2="148" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ══ ② Bildebehandling ══ -->
  <line x1="30" y1="158" x2="750" y2="158" stroke="#ddd" stroke-width="1"/>
  <circle cx="44" cy="182" r="14" fill="#2c2c2c"/>
  <text x="44" y="187" text-anchor="middle" fill="white" font-size="12" font-weight="bold">②</text>
  <text x="66" y="185" fill="#444" font-size="12" font-weight="600">معالجة الصورة / Bildebehandling</text>

