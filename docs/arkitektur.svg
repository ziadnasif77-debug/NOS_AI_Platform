  <text x="370" y="240" text-anchor="middle" fill="#b8e8d0" font-size="10">تنظيف + تصحيح انحناء + تباين  |  Deskew + støy + kontrast</text>

  <line x1="370" y1="252" x2="370" y2="276" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

