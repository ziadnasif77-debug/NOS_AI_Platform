  <text x="678" y="560" text-anchor="middle" fill="#f0d080" font-size="9">Human-in-the-Loop</text>
  <text x="678" y="575" text-anchor="middle" fill="#f0d080" font-size="9">konfidens &lt; 85%</text>
  <text x="678" y="590" text-anchor="middle" fill="#f0d080" font-size="9">الفريق يصحح يدوياً</text>

