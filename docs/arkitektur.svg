  <text x="137" y="477" text-anchor="middle" fill="#b8e8d0" font-size="10">num_beams: 4</text>

  <rect x="275" y="422" width="190" height="64" rx="8" fill="#1a6b4a"/>
  <text x="370" y="445" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Marker OCR</text>
