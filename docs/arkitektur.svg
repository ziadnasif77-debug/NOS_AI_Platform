  <text x="370" y="770" text-anchor="middle" fill="#c8b8f0" font-size="10">فهم السياق + تلخيص نرويجي  |  kontekst + oppsummering (float16)</text>

  <line x1="370" y1="782" x2="370" y2="806" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="220" y="814" width="300" height="48" rx="8" fill="#3a3a3a"/>
