  <text x="529" y="933" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Milvus</text>
  <text x="529" y="950" text-anchor="middle" fill="#f5b8b8" font-size="10">مئات ملايين متجه + BM25</text>
  <text x="529" y="964" text-anchor="middle" fill="#f5b8b8" font-size="10">HNSW + BM25 → RRF Hybrid søk</text>

  <line x1="370" y1="974" x2="370" y2="998" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

