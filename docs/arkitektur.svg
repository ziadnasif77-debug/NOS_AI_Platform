  <line x1="30" y1="406" x2="750" y2="406" stroke="#ddd" stroke-width="1"/>
  <circle cx="44" cy="430" r="14" fill="#2c2c2c"/>
  <text x="44" y="435" text-anchor="middle" fill="white" font-size="12" font-weight="bold">④</text>
