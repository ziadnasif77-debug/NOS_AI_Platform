  <line x1="30" y1="286" x2="750" y2="286" stroke="#ddd" stroke-width="1"/>
  <circle cx="44" cy="310" r="14" fill="#2c2c2c"/>
  <text x="44" y="315" text-anchor="middle" fill="white" font-size="12" font-weight="bold">③</text>
  <text x="66" y="313" fill="#444" font-size="12" font-weight="600">تصنيف نوع الوثيقة / Dokumenttype</text>

