apiVersion: apps/v1
kind: Deployment
metadata:
  name: sok
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sok
  template:
    metadata:
      labels:
        app: sok
    spec:
      containers:
        - name: sok
          image: nav/sok:lokal
          imagePullPolicy: IfNotPresent
          env:
            - name: MILVUS_VERT
              value: milvus
            - name: MILVUS_PORT
              value: "19530"
            - name: MILVUS_SAMLING
              value: nav_dokumenter
            - name: MODELLER_STI
              value: /modeller
            - name: API_NOKKEL
              valueFrom:
                secretKeyRef:
                  name: nav-hemmeligheter
                  key: API_NOKKEL
          ports:
            - containerPort: 8003
          volumeMounts:
            - name: nav-modeller
              mountPath: /modeller
            - name: nav-data
              mountPath: /data
      volumes:
        - name: nav-modeller
          persistentVolumeClaim:
            claimName: nav-modeller
        - name: nav-data
          persistentVolumeClaim:
            claimName: nav-data
---
apiVersion: v1
kind: Service
metadata:
  name: sok
spec:
  selector:
    app: sok
  ports:
    - port: 8003
      targetPort: 8003
