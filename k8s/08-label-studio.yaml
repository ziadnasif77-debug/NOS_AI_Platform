apiVersion: apps/v1
kind: Deployment
metadata:
  name: label-studio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: label-studio
  template:
    metadata:
      labels:
        app: label-studio
    spec:
      containers:
        - name: label-studio
          image: heartexlabs/label-studio:latest
          env:
            - name: LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED
              value: "true"
            - name: LABEL_STUDIO_LOCAL_FILES_DOCUMENT_ROOT
              value: /label-studio/data
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: ls-data
              mountPath: /label-studio/data
      volumes:
        - name: ls-data
          persistentVolumeClaim:
            claimName: label-studio-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: label-studio-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
# NodePort slik at Label Studio nås på http://localhost:30880
apiVersion: v1
kind: Service
metadata:
  name: label-studio
spec:
  type: NodePort
  selector:
    app: label-studio
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30880
