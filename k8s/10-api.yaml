apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: api
          image: nav/api:lokal
          imagePullPolicy: IfNotPresent
          env:
            # AUTH_MODUS=oidc + OIDC_JWKS_URL/ISSUER/AUDIENCE for
            # token-basert autentisering (Azure AD, Maskinporten, …)
            - name: AUTH_MODUS
              value: api_nokkel
            - name: KJOREMODUS
              value: kubeflow
            - name: KFP_ENDPOINT
              value: http://ml-pipeline:8888
            - name: INNTAK_STI
              value: /data/inntak
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: SOK_URL
              value: http://sok:8003
            - name: GJENNOMGANG_URL
              value: http://label-studio:8080
            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: nav-hemmeligheter
                  key: POSTGRES_URL
            - name: API_NOKKEL
              valueFrom:
                secretKeyRef:
                  name: nav-hemmeligheter
                  key: API_NOKKEL
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: nav-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /helse
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: nav-data
          persistentVolumeClaim:
            claimName: nav-data
---
# NodePort slik at API-et nås på http://localhost:30080
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  type: NodePort
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
