# ReconciliationWorker rydder utløpte låser og markerer tapte jobber.
# NB (kubeflow-modus): ghost-detektorens re-kø går til Redis og plukkes
# ikke opp av KFP — slike jobber må re-trigges manuelt eller via API-et.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reconciliation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reconciliation
  template:
    metadata:
      labels:
        app: reconciliation
    spec:
      containers:
        - name: reconciliation
          image: nav/reconciliation:lokal
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: nav-hemmeligheter
                  key: POSTGRES_URL
