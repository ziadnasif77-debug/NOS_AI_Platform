# Model serving: Borealis via vLLM (OpenAI-kompatibel API).
# NLP-workerne settes til LLM_URL=http://llm:8000/v1 og skaleres
# horisontalt (KEDA) uten å eie GPU — kun denne deploymenten har GPU.
# Protokollen er standard: bytt til TGI/Triton uten kodeendring.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nav-llm
spec:
  replicas: 1
  selector:
    matchLabels: {app: nav-llm}
  template:
    metadata:
      labels: {app: nav-llm}
    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          args:
            - --model=/modeller/borealis
            - --served-model-name=borealis
            - --quantization=bitsandbytes
            - --max-model-len=4096
            - --gpu-memory-utilization=0.90   # egen GPU i K8s — bruk den
            - --dtype=bfloat16
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: modeller
              mountPath: /modeller
              readOnly: true
          resources:
            limits:
              nvidia.com/gpu: 1
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 40           # modell-lasting tar tid
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 600
            periodSeconds: 30
      volumes:
        - name: modeller
          persistentVolumeClaim:
            claimName: nav-modeller
---
apiVersion: v1
kind: Service
metadata:
  name: llm
spec:
  selector: {app: nav-llm}
  ports:
    - port: 8000
      targetPort: 8000
