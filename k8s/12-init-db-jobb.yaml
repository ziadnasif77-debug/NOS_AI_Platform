# Engangsjobb: oppretter Postgres-skjemaet (jobs, results, audit_log, dlq).
# Kjør på nytt med: make k8s-init-db
apiVersion: batch/v1
kind: Job
metadata:
  name: nav-init-db
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: init-db
          image: nav/api:lokal
          imagePullPolicy: IfNotPresent
          command: ["python", "skript/init_db.py"]
          env:
            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: nav-hemmeligheter
                  key: POSTGRES_URL
