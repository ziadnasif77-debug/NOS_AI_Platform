# Horisontal autoskalering på Redis-kølengde via KEDA.
#
# VALGFRI — krever KEDA installert i clusteret:
#   helm repo add kedacore https://kedacore.github.io/charts
#   helm install keda kedacore/keda --namespace keda --create-namespace
# Deretter: kubectl apply -n kubeflow -f k8s/14-autoskalering.yaml
#
# Ikke inkludert i kustomization.yaml siden KEDA-CRD-ene ellers
# ville brutt «kubectl apply -k k8s/».
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: ocr-worker-skalering
spec:
  scaleTargetRef:
    name: ocr-worker
  minReplicaCount: 1
  maxReplicaCount: 10
  triggers:
    - type: redis
      metadata:
        address: redis:6379
        listName: queue:ocr
        listLength: "20"
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: nlp-worker-skalering
spec:
  scaleTargetRef:
    name: nlp-worker
  minReplicaCount: 1
  maxReplicaCount: 10
  triggers:
    - type: redis
      metadata:
        address: redis:6379
        listName: queue:nlp
        listLength: "20"
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: preprocessing-worker-skalering
spec:
  scaleTargetRef:
    name: preprocessing-worker
  minReplicaCount: 1
  maxReplicaCount: 5
  triggers:
    - type: redis
      metadata:
        address: redis:6379
        listName: queue:preprocess
        listLength: "50"
