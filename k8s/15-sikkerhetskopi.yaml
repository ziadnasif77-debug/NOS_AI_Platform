# Daglig sikkerhetskopi av Postgres (eneste kilde til sannhet).
# Kjører 02:00 — utenfor kontortid, før ev. nattlige batch-opplastinger.
# Strategi og gjenopprettingsprosedyre: docs/SIKKERHETSKOPI.md
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nav-backup
spec:
  # I produksjon: bruk en storage class på ANNEN infrastruktur enn
  # postgres-PVC-en — en sikkerhetskopi på samme disk beskytter ikke
  # mot disktap.
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 50Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nav-sikkerhetskopi
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid          # aldri to dumper samtidig
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5          # feilede kjøringer skal etterforskes
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600    # en dump skal aldri ta over en time
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: sikkerhetskopi
              image: nav/backup:lokal
              imagePullPolicy: IfNotPresent
              command: ["python3", "/app/sikkerhetskopi.py"]  # én runde, ikke daemon
              env:
                - name: POSTGRES_URL
                  valueFrom:
                    secretKeyRef:
                      name: nav-hemmeligheter
                      key: POSTGRES_URL
                - name: BACKUP_STI
                  value: /backup
                - name: DATA_STI
                  value: /data
              volumeMounts:
                - name: backup
                  mountPath: /backup
                - name: data
                  mountPath: /data
                  readOnly: true
              resources:
                requests: {cpu: 100m, memory: 128Mi}
                limits: {cpu: "1", memory: 512Mi}
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: nav-backup
            - name: data
              persistentVolumeClaim:
                claimName: nav-data
