# Oppbevaringsbegrensning: NAV tillater ikke lagring av dokumenter
# over 6 måneder. Daglig jobb kl. 03:00 (etter backup 02:00 — dumpen
# tas FØR sletting, så gjenoppretting + ny oppbevaringskjøring gir
# alltid lovlig tilstand). Se docs/OPPBEVARING.md.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nav-oppbevaring
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: oppbevaring
              image: nav/oppbevaring:lokal
              imagePullPolicy: IfNotPresent
              command: ["python", "/app/oppbevaring.py"]   # én runde
              env:
                - name: POSTGRES_URL
                  valueFrom:
                    secretKeyRef:
                      name: nav-hemmeligheter
                      key: POSTGRES_URL
                - name: API_NOKKEL
                  valueFrom:
                    secretKeyRef:
                      name: nav-hemmeligheter
                      key: API_NOKKEL
                - name: SOK_URL
                  value: http://sok:8003
                - name: DATA_STI
                  value: /data
                - name: OPPBEVARING_MAKS_DAGER
                  value: "150"
              volumeMounts:
                - name: data
                  mountPath: /data
              resources:
                requests: {cpu: 100m, memory: 128Mi}
                limits: {cpu: "1", memory: 256Mi}
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: nav-data
