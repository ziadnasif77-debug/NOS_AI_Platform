              value: "9101"
            - name: INNTAK_STI
              value: /data/inntak
            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: nav-hemmeligheter
                  key: POSTGRES_URL
          volumeMounts:
            - name: nav-data
